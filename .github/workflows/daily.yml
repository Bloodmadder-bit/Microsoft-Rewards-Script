name: Microsoft Rewards

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Create config.json
        run: |
          cat > dist/config.json << EOF
          {
            "accounts": [
              {
                "username": "${{ secrets.MS_EMAIL }}",
                "password": "${{ secrets.MS_PASSWORD }}"
              }
            ],
            "baseURL": "https://rewards.bing.com",
            "sessionPath": "sessions",
            "headless": "new",
            "runOnZeroPoints": false,
            "clusters": 1,
            "workers": {
              "doDailySet": true,
              "doMorePromotions": true,
              "doPunchCards": true,
              "doDesktopSearch": true,
              "doMobileSearch": true
            }
          }
          EOF

      - name: Run script
        run: npm start
