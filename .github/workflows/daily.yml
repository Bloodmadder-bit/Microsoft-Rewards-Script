name: Microsoft Rewards

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Create config.json
        env:
          MS_EMAIL: ${{ secrets.MS_EMAIL }}
          MS_PASSWORD: ${{ secrets.MS_PASSWORD }}
        run: |
          python3 << 'PYEOF'
          import json, os
          config = {
            "accounts": [{"username": os.environ["MS_EMAIL"], "password": os.environ["MS_PASSWORD"]}],
            "baseURL": "https://rewards.bing.com",
            "sessionPath": "sessions",
            "headless": "new",
            "runOnZeroPoints": False,
            "clusters": 1,
            "saveFingerprint": {"mobile": False, "desktop": False},
            "workers": {
              "doDailySet": True,
              "doMorePromotions": True,
              "doPunchCards": True,
              "doDesktopSearch": True,
              "doMobileSearch": True
            },
            "searchSettings": {
              "useGeoLocaleQueries": False,
              "scrollRandomly": True,
              "scrollDelay": 2000,
              "searchDelay": 3000,
              "retryMobileSearchAmount": 0
            },
            "debugLogs": False,
            "proxy": {},
            "consoleLogFilter": {},
            "webhook": {}
          }
          with open("dist/config.json", "w") as f:
            json.dump(config, f, indent=2)
          PYEOF
            }
          }
          EOF

      - name: Run script
        run: npm start
